<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Register</title>
<meta name="theme-color" content="#F7F6F3">
<script>
  // Apply the saved theme (or the system preference) before anything paints.
  try {
    var t = localStorage.getItem('attendance_theme') ||
      (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
    if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F0F12');
  } catch (e) {}
</script>
